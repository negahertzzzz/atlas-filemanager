name: CI

on:
  push:
  pull_request:

# Checks only read the repository; never hand pull requests a write token.
permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace
