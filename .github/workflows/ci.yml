name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checks only read the repository; never hand pull requests a write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
          components: rustfmt

      - name: Format
        run: cargo fmt --check

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            clang g++ pkg-config libasound2-dev libfontconfig-dev libssl-dev libvulkan-dev \
            libxcb1-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libbz2-dev liblzma-dev \
            ffmpeg

      - name: Build
        run: cargo build --workspace --locked

      - name: Packaging script tests
        run: |
          python -m unittest discover -s scripts/tests -p 'test_ci_archive.py'
          python -m unittest discover -s scripts/tests -p 'test_windows_binary_reuse.py'

      - name: CLI startup
        run: python -c "import os,subprocess; r=subprocess.run(['target/debug/atlas'+('.exe' if os.name=='nt' else ''),'--version'],capture_output=True,text=True,timeout=30,check=True); print(r.stdout); assert r.stdout.startswith('Atlas ')"

      - name: Test
        env:
          # rust-i18n's generated translation initializer exceeds the default
          # test-thread stack in debug builds. Match Atlas's 16 MiB UI stack.
          RUST_MIN_STACK: '16777216'
        run: cargo test --workspace --locked --no-fail-fast

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'

      # Fails on any known vulnerability in Cargo.lock (RustSec database).
      # Deliberate exceptions live in .cargo/audit.toml with their reason.
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
