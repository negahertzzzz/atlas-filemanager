[package]
name = "atlas-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/neondeex/atlas-filemanager"
homepage = "https://atlasnative.com"
build = "../../scripts/winfsp-build.rs"

[features]
free = ["atlas-model/free"]
default = ["provider-host"]
# Host-side virtual-provider API, independent of any concrete provider.
provider-host = [
    "dep:async-trait",
    "atlas-model/provider-host",
]
# rclone implementation used only by the external Cloud extension.
cloud-backend = ["provider-host", "dep:futures-util"]
rar = ["dep:unrar"]
sevenz = ["dep:sevenz-rust2"]

[dependencies]
atlas-model.workspace = true
anyhow.workspace = true
flume.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1"
toml = "0.8"
dirs.workspace = true
notify = "6"
notify-debouncer-mini = "0.4"
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg", "png", "gif", "webp", "tiff", "bmp", "ico",
] }
kamadak-exif = "0.6"
walkdir = "2"
# ripgrep's library crates: blazing-fast content search (goto bar "search in content").
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
grep-matcher = "0.1"
regex = "1"
unicode-casefold = "0.2"
jwalk = "0.8.1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
lofty = "0.22"
resvg = "0.45"
md-5 = "0.10"
url = "2"
sysinfo = "0.38.4"
nucleo = "0.5"
rayon = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
open = "5"
trash = "5"
zip = "9"
tar = "0.4"
flate2 = "1"
# Compression library SONAMEs differ across distros; release binaries embed them.
bzip2 = { version = "0.4", features = ["static"] }
xz2 = { version = "0.1", features = ["static"] }
unrar = { path = "vendor/unrar", version = "0.4", optional = true }

# --- marketplace / http ---
reqwest = { version = "0.12", default-features = false, features = [
    "json", "rustls-tls", "stream",
] }

# --- cloud feature (optional) ---
sha2 = "0.10"
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
sevenz-rust2 = { version = "0.21.0", optional = true }
tempfile = "3"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
fs2 = "0.4"
calamine = "0.38"
# Already linked by resvg; reuse its XML parser for bounded OOXML text extraction.
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
atlas-win-space = { path = "../atlas-win-space" }
winfsp = { version = "0.13.2", default-features = false, features = ["delayload"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_UI_Shell", "Services_Store", "Foundation_Collections"] }

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true
